name: Build ShahrBaziYas Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare Clean APK Output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ShahrBaziYas-Android-v1.0.apk
          ls -lh dist/ShahrBaziYas-Android-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShahrBaziYas-Android-APK
          path: dist/ShahrBaziYas-Android-v1.0.apk
          retention-days: 90
